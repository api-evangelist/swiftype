aid: swiftype
name: Swiftype
description: >-
  Swiftype is a hosted site-search and app-search platform founded in 2012, backed
  by Andreessen Horowitz (a16z) and DCVC, and acquired by Elastic in 2017 where it
  now operates as Elastic Site Search. Swiftype gives websites and applications
  relevance-tuned full-text search, autocomplete, a managed web crawler, document
  indexing, result ranking/weighting controls, synonyms, and query and click
  analytics. Developers integrate through the Site Search REST API at
  https://search-api.swiftype.com/api/v1/ using a private auth_token for full
  read/write access or a public engine_key for read-only client-side search, with
  official client libraries for PHP, Python, Node.js, and Ruby published under the
  Elastic GitHub organization.
